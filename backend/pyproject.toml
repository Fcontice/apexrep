[project]
name = "apexrep"
version = "0.1.0"
description = "Apex Legends stats tracker: API and polling worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
apexrep-export-openapi = "apexrep.api.export_openapi:main"
apexrep-lookup = "apexrep.als.lookup:main"
apexrep-migrate = "apexrep.migrate:main"
apexrep-record-fixture = "apexrep.als.record:main"
apexrep-seed-demo = "apexrep.dev.seed_demo:main"
apexrep-worker = "apexrep.worker:main"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexrep"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
